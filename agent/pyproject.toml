[project]
name = "convai-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore",
    "strands-agents[ollama]==1.63.0",
    "ollama==0.6.3",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
